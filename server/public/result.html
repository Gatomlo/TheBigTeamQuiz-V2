<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Résultats - The Big Team Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #e7c9a1 0%, #dabd91 45%, #cf9f74 100%);
      color: #26323f;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
      box-sizing: border-box;
    }
    #card{
      background: rgba(255,255,255,0.75);
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.16);
      padding: 24px;
      max-width: 480px;
      width: 100%;
    }
    h1{ font-size: 1.4em; margin: 0 0 4px; text-align: center; }
    #date{ text-align: center; color: #5b6472; margin-bottom: 20px; }
    .team-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.6);
      font-weight: 600;
    }
    .team-row.first{ background: #f5af00; color: #26323f; }
    .rank{ margin-right: 10px; color: #5b6472; }
    h2{ font-size: 1em; text-transform: uppercase; letter-spacing: 0.03em; color: #5b6472; margin: 24px 0 8px; }
    #epreuves{ color: #26323f; }
    #error{ text-align: center; color: #d90429; }
  </style>
</head>
<body>
  <div id="card">
    <h1>🏆 Résultats de la partie</h1>
    <div id="date"></div>
    <div id="teams"></div>
    <h2 id="epreuvesTitle" hidden>Épreuves jouées</h2>
    <div id="epreuves"></div>
    <p id="error" hidden>Ce lien de résultat est introuvable ou a expiré.</p>
  </div>
  <script>
    var token = new URLSearchParams(location.search).get('token');
    if(!token){
      document.getElementById('error').hidden = false;
    } else {
      fetch('/api/games/share/' + encodeURIComponent(token))
        .then(function(r){ if(!r.ok) throw new Error('not found'); return r.json(); })
        .then(function(game){
          document.getElementById('date').textContent = new Date(game.ended_at).toLocaleString('fr-FR');
          var teamsHtml = '';
          game.teams.forEach(function(t, i){
            teamsHtml += '<div class="team-row' + (i === 0 ? ' first' : '') + '">' +
              '<span><span class="rank">' + (i + 1) + '.</span>' + t.team_name + '</span>' +
              '<span>' + t.score + ' pts</span></div>';
          });
          document.getElementById('teams').innerHTML = teamsHtml || '<p>Aucune équipe.</p>';
          if(game.epreuves_played && game.epreuves_played.length){
            document.getElementById('epreuvesTitle').hidden = false;
            document.getElementById('epreuves').textContent = game.epreuves_played.join(', ');
          }
        })
        .catch(function(){
          document.getElementById('error').hidden = false;
        });
    }
  </script>
</body>
</html>
